<div class="layout-container">
  <!-- Header con menú horizontal -->

      <h1>Quizzapp - Harry</h1>
    <div *ngIf="welcomeMessage">
      <p>{{ welcomeMessage }}</p>
    </div>
      <nav class="main-nav">
        <app-sidebar></app-sidebar>
      </nav>
    </div>
  </header>

 
  <section   *ngIf="router.url === '/user-dashboard' || router.url === '/admin'"

  <main>

  <footer>
    <small>© 2025 - Quizzapp Harry Potter</small>
  </footer>
</div>

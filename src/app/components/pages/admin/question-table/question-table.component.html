

<!-- question-table.component.html -->
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Pregunta</th>
      <th>Respuestas</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let q of questions">
      <td>{{ q.id }}</td>
      <td>{{ q.textoPregunta }}</td>
      <td>
        <ul style="margin: 0; padding-left: 1rem;">
          <li *ngFor="let a of q.answers">
            <span [ngClass]="{ 'status-ok': a.esCorrecta, 'status-blocked': !a.esCorrecta }">
              {{ a.answerText }} <strong *ngIf="a.esCorrecta">(✔)</strong>
            </span>
          </li>
        </ul>
      </td>
      <td>
        <button (click)="onEdit(q)">Editar</button>
        <button (click)="onDelete(q)">Eliminar</button>
      </td>
    </tr>
  </tbody>
</table>



<h2>👥 Gestión de Preguntas</h2>
<app-question-table
  [questions]="questions" 
  (edit)="onEditQuestion($event)" 
  (delete)="onDeleteQuestion($event)">
</app-question-table>

<app-question-edit-modal
  [question]="selectedQuestion"
  [visible]="modalVisible"
  (saveQuestion)="onSaveQuestion($event)"
  (closeModal)="onCloseModal()">
</app-question-edit-modal>

<div class="top-controls">
  <button (click)="onCreateQuestion()">Crear nueva pregunta</button>

  <label>
    Tamaño de página:
    <select [(ngModel)]="pageSize" (change)="onPageSizeChange()">
      <option [value]="5">5</option>
      <option [value]="10">10</option>
      <option [value]="15">15</option>
    </select>
  </label>
</div>

<div class="pagination-controls">
  <button (click)="previousPage()" [disabled]="currentPage === 0">Anterior</button>
  <span>Página {{ currentPage + 1 }} de {{ totalPages }}</span>
  <button (click)="nextPage()" [disabled]="currentPage + 1 >= totalPages">Siguiente</button>
</div>

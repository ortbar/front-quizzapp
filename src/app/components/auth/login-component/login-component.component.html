<div class="login-container">
  <h2>Login</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
    <div>
      <label for="username">Usuario</label>
      <input type="text" id="username" formControlName="username">
      <div *ngIf="username?.touched && username?.invalid">
        <small class="text-danger">El nombre de usuario es obligatorio</small>
      </div>
    </div>

    <div>
      <label for="password">Contraseña</label>
      <input type="password" id="password" formControlName="password">
      <div *ngIf="password?.touched && password?.invalid">
        <small class="text-danger">La contraseña es obligatoria</small>
      </div>
    </div>

    <div *ngIf="backendError" class="text-danger" style="margin-top: 10px;">
      {{ backendError }}
    </div>

    <button type="submit" [disabled]="loginForm.invalid">Iniciar sesión</button>
  </form>

  <p>¿No tienes cuenta? <a [routerLink]="['/register']">Regístrate aquí</a></p>
</div>
